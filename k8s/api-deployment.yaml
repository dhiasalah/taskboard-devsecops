apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-api
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: taskboard
    spec:
      containers:
        - name: api
          image: dhiasalah/taskboard-api@sha256:03d3f96f49274d454ddc4653e079d0de7030f29755144bef77801ef2daedbd83
          ports:
            - containerPort: 5000
