apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-web
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: taskboard
    spec:
      containers:
        - name: web
          image: dhiasalah/taskboard-web@sha256:24e9ec713c222786c2ec4c34efb25affb475d8f4b21be2c61fb5a9d026f923f3
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
