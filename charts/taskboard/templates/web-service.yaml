apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: taskboard-web
    app.kubernetes.io/component: web
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskboard-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
