apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-api
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taskboard
  annotations:
    kubernetes.io/change-cause: "v0.2: /health shows the version"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: taskboard
    spec:
      containers:
        - name: api
          image: dhiasalah/taskboard-api@sha256:1a380e0da84deb41dd3faa3d5ca9e29b03b61c100a277e79d708ad345b9e1643
          ports:
            - containerPort: 5000
