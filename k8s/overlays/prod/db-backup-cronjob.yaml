apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels:
    app.kubernetes.io/name: taskboard-db-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: taskboard
spec:
  schedule: "0 2 * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: taskboard-db-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: taskboard
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          containers:
            - name: backup
              image: postgres@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -eo pipefail
                  file=/backups/tasks-$(date +%Y%m%d-%H%M%S).sql.gz
                  pg_dump -h db -U $POSTGRES_USER -d $POSTGRES_DB --clean --if-exists | gzip > $file.part
                  mv $file.part $file
                  find /backups -name 'tasks-*' -mtime +7 -delete
                  echo "Backup written: $file"
                  ls -lh /backups
              envFrom:
                - configMapRef:
                    name: db-config
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: db-backups
