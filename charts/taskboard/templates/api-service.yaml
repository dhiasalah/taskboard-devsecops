apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: taskboard-api
    app.kubernetes.io/component: api
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskboard-api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
