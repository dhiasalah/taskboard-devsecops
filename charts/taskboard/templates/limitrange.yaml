apiVersion: v1
kind: LimitRange
metadata:
  name: taskboard-limits
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "128Mi"
      defaultRequest:
        cpu: "25m"
        memory: "32Mi"
      max:
        cpu: "1"
        memory: "512Mi"
