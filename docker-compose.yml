name: taskboard

services:
  db:
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: app/api
    image: dhiasalah/taskboard-api:0.1
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy

  web:
    build: app/frontend
    image: dhiasalah/taskboard-web:0.1
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - front
    depends_on:
      - api

volumes:
  db-data:
    name: taskboard-db-data

networks:
  front:
  back:
