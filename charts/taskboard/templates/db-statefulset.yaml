apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskboard-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: taskboard-db
    app.kubernetes.io/component: database
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  serviceName: db-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: taskboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.db.runAsUser }}
        runAsGroup: {{ .Values.db.runAsUser }}
      containers:
        - name: db
          image: {{ .Values.db.image }}
          securityContext:
            {{- include "taskboard.containerSecurity" . | nindent 12 }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: {{ include "taskboard.dbSecret" . }}
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.db.storage }}
