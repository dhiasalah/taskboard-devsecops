<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#10B981"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#326CE5"/>
    </marker>
  </defs>

  <rect width="900" height="700" rx="20" fill="#F8FAFC"/>
  <text x="450" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#1E293B">TaskBoard v0.3 architecture</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#475569">Persistent database, nightly backups, every Pod non-root and spread over 2 workers.</text>

  <!-- Laptop column -->
  <rect x="20" y="96" width="170" height="500" rx="16" fill="#FEF3C7" fill-opacity="0.55" stroke="#F59E0B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="105" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">💻 Your laptop</text>

  <rect x="36" y="140" width="138" height="78" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#sh)"/>
  <text x="105" y="170" text-anchor="middle" font-size="22">🌐</text>
  <text x="105" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Browser</text>
  <text x="105" y="210" text-anchor="middle" font-size="12" fill="#475569">localhost:8080</text>

  <rect x="36" y="250" width="138" height="92" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#sh)"/>
  <text x="105" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">scripts\</text>
  <text x="105" y="294" text-anchor="middle" font-size="12" fill="#475569">up.ps1 / down.ps1</text>
  <text x="105" y="311" text-anchor="middle" font-size="12" fill="#475569">status.ps1 (7 checks,</text>
  <text x="105" y="327" text-anchor="middle" font-size="12" fill="#475569">read-only)</text>

  <rect x="36" y="364" width="138" height="66" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" filter="url(#sh)"/>
  <text x="105" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">🔒 secrets\db.env</text>
  <text x="105" y="410" text-anchor="middle" font-size="12" fill="#475569">Git-ignored,</text>
  <text x="105" y="424" text-anchor="middle" font-size="12" fill="#475569">never pushed</text>

  <rect x="36" y="452" width="138" height="66" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#sh)"/>
  <text x="105" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">🐳 Docker Hub</text>
  <text x="105" y="498" text-anchor="middle" font-size="12" fill="#475569">images, pinned</text>
  <text x="105" y="512" text-anchor="middle" font-size="12" fill="#475569">by @sha256 digest</text>

  <rect x="36" y="530" width="138" height="54" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2" filter="url(#sh)"/>
  <text x="105" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">📘 docs\runbook.md</text>
  <text x="105" y="571" text-anchor="middle" font-size="12" fill="#475569">5 classic failures</text>

  <!-- Cluster -->
  <rect x="220" y="96" width="660" height="500" rx="16" fill="#FFFFFF" stroke="#326CE5" stroke-width="2.5" filter="url(#sh)"/>
  <text x="240" y="122" font-size="16" font-weight="700" fill="#326CE5">☸ kind cluster "taskboard" (Kubernetes v1.37)</text>
  <text x="240" y="142" font-size="13" fill="#475569">control-plane (tainted: no app Pods) · taskboard-worker · taskboard-worker2</text>

  <!-- Namespace -->
  <rect x="240" y="156" width="620" height="424" rx="14" fill="#DBEAFE" fill-opacity="0.55" stroke="#326CE5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="256" y="180" font-size="15" font-weight="700" fill="#1E3A8A">namespace: taskboard</text>
  <text x="844" y="180" text-anchor="end" font-size="13" fill="#1E3A8A">LimitRange taskboard-limits</text>

  <!-- Services row -->
  <g font-size="13" text-anchor="middle">
    <rect x="262" y="194" width="160" height="52" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="342" y="216" font-weight="700" fill="#1E293B">Service web</text>
    <text x="342" y="234" fill="#475569">ClusterIP :80</text>

    <rect x="470" y="194" width="160" height="52" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="550" y="216" font-weight="700" fill="#1E293B">Service api</text>
    <text x="550" y="234" fill="#475569">ClusterIP :5000</text>

    <rect x="678" y="194" width="160" height="52" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="758" y="216" font-weight="700" fill="#1E293B">Service db (+ headless)</text>
    <text x="758" y="234" fill="#475569">ClusterIP :5432</text>
  </g>

  <!-- Workloads row -->
  <g font-size="13" text-anchor="middle">
    <rect x="262" y="276" width="160" height="136" rx="12" fill="#FFFFFF" stroke="#326CE5" stroke-width="2"/>
    <text x="342" y="298" font-weight="700" fill="#1E293B">Deployment web</text>
    <text x="342" y="316" fill="#475569">nginx · 2 Pods</text>
    <text x="342" y="334" fill="#047857">👤 UID 101, no root</text>
    <text x="342" y="352" fill="#047857">drop ALL capabilities</text>
    <text x="342" y="370" fill="#475569">spread: 1 per worker</text>
    <text x="342" y="388" fill="#475569">probes, limits</text>

    <rect x="470" y="276" width="160" height="136" rx="12" fill="#FFFFFF" stroke="#326CE5" stroke-width="2"/>
    <text x="550" y="298" font-weight="700" fill="#1E293B">Deployment api</text>
    <text x="550" y="316" fill="#475569">Flask v0.2 · 3 Pods</text>
    <text x="550" y="334" fill="#047857">👤 UID 10001, no root</text>
    <text x="550" y="352" fill="#047857">drop ALL capabilities</text>
    <text x="550" y="370" fill="#475569">spread: 2 + 1</text>
    <text x="550" y="388" fill="#475569">maxUnavailable: 0</text>

    <rect x="678" y="276" width="160" height="136" rx="12" fill="#FFFFFF" stroke="#326CE5" stroke-width="2"/>
    <text x="758" y="298" font-weight="700" fill="#1E293B">StatefulSet db</text>
    <text x="758" y="316" fill="#475569">Postgres 18 · 1 Pod</text>
    <text x="758" y="334" fill="#047857">👤 UID 70, no root</text>
    <text x="758" y="352" fill="#047857">drop ALL capabilities</text>
    <text x="758" y="370" fill="#475569">pg_isready probes</text>
    <text x="758" y="388" fill="#475569">name: taskboard-db-0</text>
  </g>

  <!-- service -> workload -->
  <g stroke="#10B981" stroke-width="2.5" fill="none">
    <path d="M 342 246 L 342 272" marker-end="url(#arrG)"/>
    <path d="M 550 246 L 550 272" marker-end="url(#arrG)"/>
    <path d="M 758 246 L 758 272" marker-end="url(#arrG)"/>
    <path d="M 422 330 C 446 330 446 226 466 222" marker-end="url(#arrG)"/>
    <path d="M 630 330 C 654 330 654 226 674 222" marker-end="url(#arrG)"/>
  </g>

  <!-- Bottom row: config, secret, backups, disks -->
  <g font-size="13" text-anchor="middle">
    <rect x="262" y="432" width="160" height="56" rx="12" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
    <text x="342" y="455" font-weight="700" fill="#1E293B">ConfigMap db-config</text>
    <text x="342" y="474" fill="#475569">DB_HOST, name, user</text>

    <rect x="262" y="502" width="160" height="56" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="342" y="525" font-weight="700" fill="#1E293B">Secret db-secret</text>
    <text x="342" y="544" fill="#B91C1C">only base64 (gap)</text>

    <rect x="470" y="432" width="160" height="126" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="550" y="455" font-weight="700" fill="#1E293B">CronJob db-backup</text>
    <text x="550" y="474" fill="#475569">02:00 Europe/Paris</text>
    <text x="550" y="492" fill="#475569">pg_dump | gzip, 7 days</text>
    <text x="550" y="510" fill="#047857">👤 UID 70, no root</text>
    <text x="550" y="528" fill="#475569">+ Job restore-test</text>
    <text x="550" y="546" fill="#475569">(proves a restore works)</text>

    <rect x="678" y="432" width="160" height="56" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="758" y="455" font-weight="700" fill="#1E293B">💾 PVC (db data)</text>
    <text x="758" y="474" fill="#475569">1Gi · own disk</text>

    <rect x="678" y="502" width="160" height="56" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="758" y="525" font-weight="700" fill="#1E293B">💾 PVC db-backups</text>
    <text x="758" y="544" fill="#B91C1C">same laptop (gap)</text>
  </g>

  <!-- db -> its disk, backup -> db, backup -> backups disk -->
  <path d="M 758 412 L 758 428" fill="none" stroke="#326CE5" stroke-width="2.5" marker-end="url(#arrB)"/>
  <path d="M 630 462 C 660 462 664 400 676 396" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="652" y="502" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">dump</text>
  <path d="M 630 530 L 674 530" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- laptop arrows -->
  <path d="M 174 180 C 210 180 230 220 258 220" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="105" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">port-forward → web:80</text>
  <path d="M 174 398 C 210 398 230 530 258 530" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
  <path d="M 174 486 C 214 486 226 400 258 392" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
  <text x="202" y="468" font-size="12" font-weight="700" fill="#6D28D9">pull</text>

  <!-- caption -->
  <text x="450" y="626" text-anchor="middle" font-size="14" fill="#1E293B">Green = traffic: browser → web → api → db, all inside the cluster. 👤 = non-root badge (securityContext).</text>
  <text x="450" y="648" text-anchor="middle" font-size="14" fill="#1E293B">Red = still open (docs/security-gaps.md): base64 Secret, backups on the same machine, any Pod can reach db.</text>
  <text x="450" y="674" text-anchor="middle" font-size="13" fill="#64748B">Next, v0.4: TaskBoard packaged as a Helm chart, with Kustomize overlays.</text>
</svg>
