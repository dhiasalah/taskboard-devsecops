apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-db
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 1
  strategy: # NEW (1)
    type: Recreate # NEW (1)
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: taskboard
    spec:
      containers:
        - name: db
          image: postgres@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
