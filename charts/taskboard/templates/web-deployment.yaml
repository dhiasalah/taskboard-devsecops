apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: taskboard-web
    app.kubernetes.io/component: web
    {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/no-anti-affinity: "Pods are spread with topologySpreadConstraints"
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: taskboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.web.runAsUser }}
        runAsGroup: {{ .Values.web.runAsUser }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: taskboard-web
      containers:
        - name: web
          image: {{ .Values.web.image }}
          securityContext:
            {{- include "taskboard.containerSecurity" . | nindent 12 }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
