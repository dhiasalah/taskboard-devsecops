apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups
  labels:
    app.kubernetes.io/name: taskboard-db-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: taskboard
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
