apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-db
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: taskboard
    spec:
      containers:
        - name: db
          image: postgres@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
