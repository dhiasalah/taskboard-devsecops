apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: taskboard-db
    app.kubernetes.io/component: database
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskboard-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
